[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdlscore"
version = "0.1.0"
description = "Score a file's description length under a code LM, conditioned on repo context — a Kolmogorov-complexity proxy an agent can use to steer refactors."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mdlscore = "mdlscore.cli:main"

[tool.setuptools.packages.find]
include = ["mdlscore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
